<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--länkar till css-->
        <link rel="stylesheet" href="styles/base.css">
        <link rel="stylesheet" href="styles/nav.css">
        <link rel="stylesheet" href="styles/password-generator.css">
        <title>Krillzone</title>
    </head>



    <body>
        <header class="site-header">
            <h1>Krillzone</h1>
        </header>

        <nav class="main-nav">
            <a href="#password-generator">Password generator</a>
            <a href="#country-code-lookup">Country code lookup</a>
            <a href="#tbd">TBD</a>
        </nav>

        

        <!------------Password generator-------------->

        <section id="password-generator" class="page-section">
            <div class="generator">
                <h2>Password generator</h2>

                <div class="field-row">
                    <label for="length">Antal tecken</label>
                    <select id="length">
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10" selected>10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-row">
                        <input type="checkbox" id="include-numbers" checked>
                        <label for="include-numbers">Siffror</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="include-letters" checked>
                        <label for="include-letters">Stora/små bokstäver</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="include-symbols" checked>
                        <label for="include-symbols">Symboler</label>
                    </div>
                </div>

                <!--generera knapp & copy-->
                <button id="generate-btn" class="btn">Generera lösenord</button>

                <div class="result-row">
                    <input type="text" id="result" readonly>
                    <button id="copy-btn" class="btn">Kopiera</button>
                </div>
            </div>
        </section>

        <!------------Password generator-------------->











        <section id="country-code-lookup" class="page-section">
            <h2>Country code lookup</h2>
        </section>

        <section id="tbd" class="page-section">
            <h2>TBD</h2>
        </section>


        <script src="scripts/nav.js"></script>
        <script src="scripts/password-generator.js"></script>
    </body>





</html>
